name: context-metadata-apply

on:
  push:
    branches:
      - work/webmodel-context-metadata-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[context-metadata-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/webmodel-context-metadata-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply minimal context metadata plumbing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'internal/config/config.go',
              '''\t// Alias is the model name alias that clients will use to reference this model.\n\tAlias string `yaml:"alias" json:"alias"`\n\n\t// ForceMapping rewrites upstream response model fields back to Alias.\n''',
              '''\t// Alias is the model name alias that clients will use to reference this model.\n\tAlias string `yaml:"alias" json:"alias"`\n\n\t// ContextLength is the client-visible context window advertised for this model.\n\t// Zero means unknown and is omitted from model discovery.\n\tContextLength int `yaml:"context-length,omitempty" json:"context-length,omitempty"`\n\n\t// ForceMapping rewrites upstream response model fields back to Alias.\n''',
          )

          replace_once(
              'sdk/cliproxy/service.go',
              '''\t\tmodels = append(models, &ModelInfo{\n\t\t\tID:          modelID,\n\t\t\tObject:      "model",\n\t\t\tCreated:     now,\n\t\t\tOwnedBy:     compat.Name,\n\t\t\tType:        modelType,\n\t\t\tDisplayName: modelID,\n\t\t\tUserDefined: false,\n\t\t\tThinking:    thinking,\n\t\t})\n''',
              '''\t\tmodels = append(models, &ModelInfo{\n\t\t\tID:            modelID,\n\t\t\tObject:        "model",\n\t\t\tCreated:       now,\n\t\t\tOwnedBy:       compat.Name,\n\t\t\tType:          modelType,\n\t\t\tDisplayName:   modelID,\n\t\t\tContextLength: model.ContextLength,\n\t\t\tUserDefined:   false,\n\t\t\tThinking:      thinking,\n\t\t})\n''',
          )

          replace_once(
              'internal/watcher/diff/model_hash.go',
              '''\t\t\tout(strings.ToLower(name) + "|" + strings.ToLower(alias) + "|" + fmt.Sprintf("image=%t", model.Image))\n''',
              '''\t\t\tout(strings.ToLower(name) + "|" + strings.ToLower(alias) + "|" + fmt.Sprintf("image=%t|context=%d", model.Image, model.ContextLength))\n''',
          )
          PY

          cat > sdk/cliproxy/openai_compat_context_metadata_test.go <<'EOF'
          package cliproxy

          import (
          	"testing"

          	"github.com/router-for-me/CLIProxyAPI/v7/sdk/config"
          )

          func TestBuildOpenAICompatibilityConfigModelsPreservesContextLength(t *testing.T) {
          	models := buildOpenAICompatibilityConfigModels(&config.OpenAICompatibility{
          		Name: "webmodel",
          		Models: []config.OpenAICompatibilityModel{
          			{Name: "gemini-web/gemini-3.1-pro", Alias: "webmodel-gemini-3.1-pro", ContextLength: 1_048_576},
          			{Name: "unknown/model", Alias: "webmodel-unknown"},
          		},
          	})
          	if len(models) != 2 {
          		t.Fatalf("expected 2 models, got %d", len(models))
          	}
          	if got := models[0].ContextLength; got != 1_048_576 {
          		t.Fatalf("expected context length 1048576, got %d", got)
          	}
          	if got := models[1].ContextLength; got != 0 {
          		t.Fatalf("unknown context must remain zero, got %d", got)
          	}
          }
          EOF

          cat > internal/config/openai_compat_context_metadata_test.go <<'EOF'
          package config

          import (
          	"testing"

          	"gopkg.in/yaml.v3"
          )

          func TestOpenAICompatibilityModelContextLengthYAML(t *testing.T) {
          	var model OpenAICompatibilityModel
          	if err := yaml.Unmarshal([]byte("name: gemini-web/gemini-3.1-pro\nalias: webmodel-gemini-3.1-pro\ncontext-length: 1048576\n"), &model); err != nil {
          		t.Fatalf("unmarshal: %v", err)
          	}
          	if model.ContextLength != 1_048_576 {
          		t.Fatalf("expected context length 1048576, got %d", model.ContextLength)
          	}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/watcher/diff/model_hash_test.go')
          text = p.read_text()
          marker = '''func TestComputeOpenAICompatModelsHash_NormalizesAndDedups(t *testing.T) {'''
          test = '''func TestComputeOpenAICompatModelsHash_IncludesContextLength(t *testing.T) {\n\tbase := ComputeOpenAICompatModelsHash([]config.OpenAICompatibilityModel{{Name: "model", Alias: "alias", ContextLength: 128_000}})\n\tchanged := ComputeOpenAICompatModelsHash([]config.OpenAICompatibilityModel{{Name: "model", Alias: "alias", ContextLength: 1_000_000}})\n\tif base == "" || changed == "" {\n\t\tt.Fatal("hashes should not be empty")\n\t}\n\tif base == changed {\n\t\tt.Fatal("hash should change when context length changes")\n\t}\n}\n\n'''
          if 'TestComputeOpenAICompatModelsHash_IncludesContextLength' not in text:
              if marker not in text:
                  raise SystemExit('model_hash_test.go: insertion marker missing')
              p.write_text(text.replace(marker, test + marker, 1))
          PY

          gofmt -w internal/config/config.go internal/config/openai_compat_context_metadata_test.go internal/watcher/diff/model_hash.go internal/watcher/diff/model_hash_test.go sdk/cliproxy/service.go sdk/cliproxy/openai_compat_context_metadata_test.go

          go test ./internal/config ./internal/watcher/diff ./sdk/cliproxy
          go vet ./internal/config ./internal/watcher/diff ./sdk/cliproxy
          go build ./cmd/server

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/config/config.go internal/config/openai_compat_context_metadata_test.go internal/watcher/diff/model_hash.go internal/watcher/diff/model_hash_test.go sdk/cliproxy/service.go sdk/cliproxy/openai_compat_context_metadata_test.go
          git commit -m 'feat: publish openai-compat context metadata [context-metadata-apply]'
          git push origin HEAD:work/webmodel-context-metadata-v1
