name: repair-validation

on:
  push:
    branches:
      - fix/responses-http-continuation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l sdk/api/handlers/openai/openai_responses_handlers.go sdk/api/handlers/openai/openai_responses_http_replay.go sdk/api/handlers/openai/openai_responses_http_replay_test.go)"
      - name: Targeted tests
        run: go test ./sdk/api/handlers/openai
      - name: Full tests
        run: go test ./...
      - name: Build
        run: go build -o test-output ./cmd/server
